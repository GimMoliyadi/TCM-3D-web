/* 启动兜底：只有 React 真正挂载出内容才撤掉加载层；
   否则（脚本报错 / 资源 404 / 网络或代理故障）给出可读提示，不留白屏。 */
(function () {
  var MAX_WAIT = 15000, t0 = Date.now();
  function mounted() {
    var r = document.getElementById("root");
    return !!(r && r.childElementCount > 0);
  }
  function dropOverlay() {
    var el = document.getElementById("boot-loading");
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }
  function failed(msg) {
    var el = document.getElementById("boot-loading");
    if (!el) return;
    el.innerHTML =
      '<div style="max-width:520px;padding:0 24px">' +
      '<div style="font-size:34px;line-height:1;margin-bottom:12px">\u26a0\ufe0f</div>' +
      '<strong>3D 模型加载失败</strong>' +
      '<span>' + msg + '</span>' +
      '<button onclick="location.reload()" style="margin-top:18px;background:#06b6d4;color:#062b33;' +
      'border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer">' +
      '刷新重试</button></div>';
  }
  window.addEventListener("error", function (e) {
    if (!mounted()) {
      failed("页面脚本执行出错：" + (e.message || "未知错误") + "。若与网络或代理有关，请检查后刷新重试。");
    }
  }, true);
  var timer = setInterval(function () {
    if (mounted()) { clearInterval(timer); dropOverlay(); return; }
    if (Date.now() - t0 > MAX_WAIT) {
      clearInterval(timer);
      failed("等待超过 15 秒仍未完成加载。模型文件较大，请检查网络或代理后刷新重试。");
    }
  }, 400);
})();
</script></body></html>
